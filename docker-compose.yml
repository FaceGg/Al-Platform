# AI Model Training Platform - Docker Compose
version: "3.9"

services:
  backend:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/ml_platform.db
      - SECRET_KEY=change-me-in-production
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./ml-platform/backend/data:/app/data
      - ./ml-platform/backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./ml-platform/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
