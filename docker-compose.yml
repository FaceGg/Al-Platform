# AI Model Training Platform - Docker Compose

# A 批次十四：日志轮转（json-file 默认无上限）——所有长驻服务共用，
# via YAML anchor；一次性服务（migrate/minio-init）不需要。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ml_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-mlflow.sql:/docker-entrypoint-initdb.d/10-init-mlflow.sql:ro
  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  minio:
    restart: unless-stopped
    logging: *default-logging
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "/usr/bin/minio", "--version"]
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-ml-platform}"]
    restart: on-failure
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ml-platform}
      MC_HOST_local: "http://${MINIO_ROOT_USER:?set MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}@minio:9000"
  migrate:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
      network: ${COMPOSE_BUILD_NETWORK:-host}
      args:
        # AE 自编码器族启用开关（2026-11-17 用户拍板：本地栈 WITH_TORCH=1）。
        # 默认 0 不改默认行为；启用方式：WITH_TORCH=1 docker compose build ...
        WITH_TORCH: ${WITH_TORCH:-0}
    command: ["alembic", "upgrade", "head"]
    environment: &production-environment
      APP_MODE: production
      PYTHON_SCRIPT_VENV_DIR: /data/python-script-venv
      # LLM 档案密钥解密主密钥：worker/scheduler 同样跑智能体链路（S1-S4
      # 网关调用要解密档案密钥），缺失时 resolve_profile 返回空 key、任务
      # 全部 AGENT_RUN_NOT_EXECUTABLE（2026-11-18 实测：仅 backend 配置，
      # force-recreate worker 后智能体全挂）。
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:-}
      # 外部数据源口令加密主密钥（B1-08/D8）：与 LLM 主密钥同属 production
      # 必填校验——缺失时 migrate 容器导入配置即被拒（fail-closed）。全新安装由
      # install 脚本写入 .env，存量升级先跑 prepare-production-secrets.sh 补键。
      DATASOURCE_MASTER_KEY: ${DATASOURCE_MASTER_KEY:-}
      # 初始管理员口令（仅全新数据库首启需要；已部署环境 admin 已存在不受影响）。
      # 留空时后端在"库中无 admin"场景拒绝启动（fail-closed），由后端裁决而非
      # compose 强制，保证老部署升级重启不因缺新变量而失败。
      ML_PLATFORM_ADMIN_INITIAL_PASSWORD: ${ML_PLATFORM_ADMIN_INITIAL_PASSWORD:-}
      # UMAP（numba JIT）在部分镜像/系统路径下无法定位缓存定位器，显式重定向
      NUMBA_CACHE_DIR: /tmp/numba-cache
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      # 升级批次：DB 连接池保守上调（默认 pool_size=5/overflow=10 对 uvicorn
      # 2 worker + chat 同步化后的每请求占用偏紧）。精确值待压测校准，压测
      # 前取 2x 默认；SQLAlchemy 池超限会等 pool_timeout 而非报错，方向安全
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      # A-02：内部服务令牌/门户会话签名密钥——历史默认值可伪造令牌（实证），
      # production 校验拒绝默认值，compose 侧强制显式注入
      ANNOTATOR_SERVICE_SECRET: ${ANNOTATOR_SERVICE_SECRET:?set ANNOTATOR_SERVICE_SECRET}
      TASK_BACKEND: celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      REDIS_EVENTS_URL: ${REDIS_EVENTS_URL:?set REDIS_EVENTS_URL}
      ARTIFACT_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-ml-platform}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?set MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-s3://ml-platform/mlflow}
      TENSORBOARD_GATEWAY_URL: ${TENSORBOARD_GATEWAY_URL:-http://tensorboard-gateway:6006}
      TENSORBOARD_SESSION_SECRET: ${TENSORBOARD_SESSION_SECRET:?set TENSORBOARD_SESSION_SECRET}
      TENSORBOARD_LOG_ROOT: /var/lib/tensorboard/runs
      INFERENCE_RUNTIME_URL: ${INFERENCE_RUNTIME_URL:-http://inference-runtime:7000}
      INFERENCE_INTERNAL_SECRET: ${INFERENCE_INTERNAL_SECRET:?set INFERENCE_INTERNAL_SECRET}
      # Neo4j 图存储投影（五阶段 KG 流水线）：backend/worker 同 env（查询端点
      # 与任务内投影都要连）。未起 neo4j 服务时投影自动降级（available=False，
      # 图查询走 PG 兜底），缺这几个变量不炸服务。
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kgdevpass123}
      LOGIN_IP_RATE_LIMIT_CAPACITY: ${LOGIN_IP_RATE_LIMIT_CAPACITY:-5}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      FRONTEND_ORIGIN_ALIASES: ${FRONTEND_ORIGIN_ALIASES:-}
      INFERENCE_RATE_LIMIT_CAPACITY: ${INFERENCE_RATE_LIMIT_CAPACITY:-100}
      INFERENCE_RATE_LIMIT_REFILL_PER_SECOND: ${INFERENCE_RATE_LIMIT_REFILL_PER_SECOND:-10}
      INFERENCE_ROLLOUT_OBSERVATION_SECONDS: ${INFERENCE_ROLLOUT_OBSERVATION_SECONDS:-60}
      NOTIFICATION_MASTER_KEY_FILE: /run/secrets/notification_master_key
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      ML_PLATFORM_TEMP_DIR: /tmp/ml-platform
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - notification_master_key

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.0
    command:
      - /bin/sh
      - -c
      - >-
        if ls /opt/mlflow-wheel/psycopg-3.3.5-py3-none-any.whl >/dev/null 2>&1; then
        pip install --no-index --no-deps --force-reinstall
        /opt/mlflow-wheel/psycopg-3.3.5-py3-none-any.whl
        /opt/mlflow-wheel/psycopg_binary-3.3.5-cp310-cp310-manylinux2014_x86_64.manylinux_2_17_x86_64.whl;
        else
        pip install --no-deps psycopg==3.3.5 psycopg-binary==3.3.5;
        fi
        &&
        mlflow server
        --host 0.0.0.0
        --port 5000
        --allowed-hosts "$$MLFLOW_ALLOWED_HOSTS"
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --artifacts-destination "$$MLFLOW_ARTIFACT_ROOT"
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?set MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-s3://ml-platform/mlflow}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,localhost:*,127.0.0.1:*}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - ${MLFLOW_WHEEL_DIR:-./ml-platform/backend/mlflow-wheel}:/opt/mlflow-wheel:ro
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 10s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  tensorboard-gateway:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile.tensorboard
      network: ${COMPOSE_BUILD_NETWORK:-host}
    environment:
      TENSORBOARD_SESSION_SECRET: ${TENSORBOARD_SESSION_SECRET:?set TENSORBOARD_SESSION_SECRET}
      TENSORBOARD_SESSION_TTL_SECONDS: ${TENSORBOARD_SESSION_TTL_SECONDS:-300}
      TENSORBOARD_IDLE_TIMEOUT_SECONDS: ${TENSORBOARD_IDLE_TIMEOUT_SECONDS:-600}
      TENSORBOARD_LOG_ROOT: /var/lib/tensorboard/runs
    volumes:
      - tensorboard-events:/var/lib/tensorboard/runs
    expose:
      - "6006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  inference-runtime:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile.inference
      network: ${COMPOSE_BUILD_NETWORK:-host}
    environment:
      APP_MODE: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      # A-02：内部服务令牌/门户会话签名密钥——历史默认值可伪造令牌（实证），
      # production 校验拒绝默认值，compose 侧强制显式注入
      ANNOTATOR_SERVICE_SECRET: ${ANNOTATOR_SERVICE_SECRET:?set ANNOTATOR_SERVICE_SECRET}
      TASK_BACKEND: celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      REDIS_EVENTS_URL: ${REDIS_EVENTS_URL:?set REDIS_EVENTS_URL}
      ARTIFACT_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-ml-platform}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?set MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-s3://ml-platform/mlflow}
      TENSORBOARD_GATEWAY_URL: ${TENSORBOARD_GATEWAY_URL:-http://tensorboard-gateway:6006}
      TENSORBOARD_SESSION_SECRET: ${TENSORBOARD_SESSION_SECRET:?set TENSORBOARD_SESSION_SECRET}
      INFERENCE_RUNTIME_URL: ${INFERENCE_RUNTIME_URL:-http://inference-runtime:7000}
      INFERENCE_INTERNAL_SECRET: ${INFERENCE_INTERNAL_SECRET:?set INFERENCE_INTERNAL_SECRET}
      INFERENCE_RATE_LIMIT_CAPACITY: ${INFERENCE_RATE_LIMIT_CAPACITY:-100}
      INFERENCE_RATE_LIMIT_REFILL_PER_SECOND: ${INFERENCE_RATE_LIMIT_REFILL_PER_SECOND:-10}
      INFERENCE_ROLLOUT_OBSERVATION_SECONDS: ${INFERENCE_ROLLOUT_OBSERVATION_SECONDS:-60}
      NOTIFICATION_MASTER_KEY_FILE: /run/secrets/notification_master_key
      # 推理运行时同样以 production 模式导入应用配置：两把 Fernet 主密钥是
      # production 必填项（D8），缺失时容器启动即被校验拒绝（与通知密钥同形）。
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:-}
      DATASOURCE_MASTER_KEY: ${DATASOURCE_MASTER_KEY:-}
      ML_PLATFORM_TEMP_DIR: /tmp/ml-platform
    expose:
      - "7000"
    volumes:
      - inference-cache:/var/lib/ml-platform/inference-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      tensorboard-gateway:
        condition: service_healthy
    secrets:
      - notification_master_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  neo4j:
    # 五阶段 KG 流水线的图存储投影（PG 仍是事务主源）。heap/pagecache 限死
    # 防 WSL 内存挤爆；仅内网，不暴露宿主端口（查询走 backend API）。
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kgdevpass123}
      # WSL 总内存 7.9GB 的宿主上全栈共存：heap/pagecache 再压一档
      # （2026-11-20 实测默认档曾把 WSL 挤到崩溃重启）
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
      network: ${COMPOSE_BUILD_NETWORK:-host}
      args:
        WITH_TORCH: ${WITH_TORCH:-0}
    ports:
      # A-02：默认回环绑定——backend 直发端口不再暴露公网（nginx 是唯一入口；
      # CI/本地探活走 127.0.0.1 不受影响，需外部访问时显式设 BACKEND_BIND_ADDRESS）
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8001}:8000"
    environment:
      <<: *production-environment
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MASTER_KEY: ${LLM_MASTER_KEY:-}
      DATASOURCE_MASTER_KEY: ${DATASOURCE_MASTER_KEY:-}
      KNOWLEDGE_GRAPH_MAX_EXTRACT_CHARS: ${KNOWLEDGE_GRAPH_MAX_EXTRACT_CHARS:-2000000}
      KNOWLEDGE_GRAPH_TIME_BUDGET_SECONDS: ${KNOWLEDGE_GRAPH_TIME_BUDGET_SECONDS:-120}
    volumes:
      - ./ml-platform/backend/data:/app/data
      - ./ml-platform/backend/uploads:/app/app/uploads
      - python-script-venv:/data/python-script-venv
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      tensorboard-gateway:
        condition: service_healthy
      inference-runtime:
        condition: service_healthy
    secrets:
      - notification_master_key

  annotator:
    build:
      context: ./ml-platform/annotator/backend
      dockerfile: Dockerfile
      network: ${COMPOSE_BUILD_NETWORK:-host}
    ports:
      - "${ANNOTATOR_BIND_ADDRESS:-127.0.0.1}:${ANNOTATOR_API_PORT:-8444}:8443"
    environment:
      ANNOTATOR_PORT: 8443
      ANNOTATOR_API_ORIGIN: ${ANNOTATOR_API_ORIGIN:-http://backend:8000}
      ANNOTATOR_PUBLIC_ORIGIN: ${ANNOTATOR_PUBLIC_ORIGIN:-http://localhost:8443}
      ANNOTATOR_COOKIE_SECURE: ${ANNOTATOR_COOKIE_SECURE:-true}
      # A-02：与 backend 同源密钥（sidecar 签发内部令牌、backend 验签）
      ANNOTATOR_SERVICE_SECRET: ${ANNOTATOR_SERVICE_SECRET:?set ANNOTATOR_SERVICE_SECRET}
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  annotator-frontend:
    build:
      context: ./ml-platform/annotator/frontend
      dockerfile: Dockerfile
      network: ${COMPOSE_BUILD_NETWORK:-host}
    ports:
      - "${ANNOTATOR_PORT:-8443}:80"
    depends_on:
      - annotator
    restart: unless-stopped
    logging: *default-logging

  worker:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile.worker
      network: ${COMPOSE_BUILD_NETWORK:-host}
      args:
        WITH_TORCH: ${WITH_TORCH:-0}
    environment: *production-environment
    volumes:
      - tensorboard-events:/var/lib/tensorboard/runs
      - python-script-venv:/data/python-script-venv
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      tensorboard-gateway:
        condition: service_healthy
    secrets:
      - notification_master_key

  scheduler:
    # 周期任务唯一宿主（智能体僵尸清扫/推理部署对账/通知派发等）：缺重启
    # 策略时宿主或 Docker 守护进程重启后它不会回来，周期任务全部静默停摆
    restart: unless-stopped
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile.worker
      network: ${COMPOSE_BUILD_NETWORK:-host}
      args:
        WITH_TORCH: ${WITH_TORCH:-0}
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    environment: *production-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    secrets:
      - notification_master_key

  frontend:
    build:
      context: ./ml-platform/frontend
      dockerfile: Dockerfile
      network: ${COMPOSE_BUILD_NETWORK:-host}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging: *default-logging

  # B1-07（F5，D48）：实时接入的可选 profile——默认 16 服务栈完全不变，
  # `docker compose --profile kafka up -d` 才启动 Kafka 与消费进程。
  # 无真实流量不宣称链路生效（诚实设计⑤）：页脚由消费心跳驱动，
  # 未启用时如实显示「实时链路未启用」。
  kafka:
    image: bitnami/kafka:3.7
    profiles: ["kafka"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    restart: unless-stopped
    logging: *default-logging

  kafka-ingest:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
      network: ${COMPOSE_BUILD_NETWORK:-host}
    profiles: ["kafka"]
    command:
      - python
      - -m
      - app.tasks.ingest_worker
    environment:
      <<: *production-environment
      KAFKA_INGEST_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INGEST_TOPIC: ${KAFKA_INGEST_TOPIC:-quality-ingest}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    secrets:
      - notification_master_key
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  minio-data:
  tensorboard-events:
  inference-cache:
  python-script-venv:
  neo4j-data:
  kafka-data:

secrets:
  notification_master_key:
    file: ${NOTIFICATION_CRYPTO_SECRET_FILE:-./secrets/notification_master_key}

# 路径实测 MTU ≈1490（宿主走 TUN/VPN 隧道有封装开销），默认 1500 的
# 大上行包（如 LLM 非流式长请求的数百 KB body）会被中间设备静默丢弃，
# 表现为 S1 长生成 Connection reset by peer 而短请求正常。留余量取 1480。
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1480"
