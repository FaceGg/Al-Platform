# AI Model Training Platform - Docker Compose
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ml_platform}
      POSTGRES_USER: ${POSTGRES_USER:-ml_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/postgres/init-mlflow.sql:/docker-entrypoint-initdb.d/10-init-mlflow.sql:ro
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        && mc mb --ignore-existing local/$${MINIO_BUCKET:-ml-platform}
    command: []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  migrate:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &production-environment
      APP_MODE: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      TASK_BACKEND: celery
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-}
      REDIS_EVENTS_URL: ${REDIS_EVENTS_URL:?set REDIS_EVENTS_URL}
      ARTIFACT_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-ml-platform}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?set MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-s3://ml-platform/mlflow}
      TENSORBOARD_GATEWAY_URL: ${TENSORBOARD_GATEWAY_URL:-http://tensorboard-gateway:6006}
      TENSORBOARD_SESSION_SECRET: ${TENSORBOARD_SESSION_SECRET:?set TENSORBOARD_SESSION_SECRET}
      TENSORBOARD_LOG_ROOT: /var/lib/tensorboard/runs
      ML_PLATFORM_TEMP_DIR: /tmp/ml-platform
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0
    command:
      - /bin/sh
      - -c
      - >-
        pip config set global.index-url https://mirrors.aliyun.com/pypi/simple/
        && pip install --retries 10 --timeout 120 "psycopg[binary]"
        &&
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --artifacts-destination "$$MLFLOW_ARTIFACT_ROOT"
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?set MLFLOW_BACKEND_STORE_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-s3://ml-platform/mlflow}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  tensorboard-gateway:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile.tensorboard
    environment:
      TENSORBOARD_SESSION_SECRET: ${TENSORBOARD_SESSION_SECRET:?set TENSORBOARD_SESSION_SECRET}
      TENSORBOARD_SESSION_TTL_SECONDS: ${TENSORBOARD_SESSION_TTL_SECONDS:-300}
      TENSORBOARD_IDLE_TIMEOUT_SECONDS: ${TENSORBOARD_IDLE_TIMEOUT_SECONDS:-600}
      TENSORBOARD_LOG_ROOT: /var/lib/tensorboard/runs
    volumes:
      - tensorboard-events:/var/lib/tensorboard/runs
    expose:
      - "6006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *production-environment
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./ml-platform/backend/data:/app/data
      - ./ml-platform/backend/uploads:/app/app/uploads
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      tensorboard-gateway:
        condition: service_healthy

  worker:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile.worker
    environment: *production-environment
    volumes:
      - tensorboard-events:/var/lib/tensorboard/runs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      tensorboard-gateway:
        condition: service_healthy

  frontend:
    build:
      context: ./ml-platform/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  tensorboard-events:
