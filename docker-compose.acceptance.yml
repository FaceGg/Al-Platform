# Controlled services for isolated production acceptance only.
services:
  postgres:
    ports:
      - "127.0.0.1:${WEEK12_POSTGRES_PORT:-15432}:5432"

  inference-runtime:
    ports:
      - "127.0.0.1:${WEEK12_INFERENCE_RUNTIME_PORT:-17000}:7000"

  mailpit:
    image: axllent/mailpit:v1.21
    expose:
      - "1025"
      - "8025"
    ports:
      - "127.0.0.1:${WEEK12_MAILPIT_PORT:-18082}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"

  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ml-platform-acceptance@localhost
      SMTP_USE_TLS: "false"
      NOTIFICATION_TEST_SMTP_API_URL: http://mailpit:8025/api/v1/messages
      HTTPS_PROXY: http://notification-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,mlflow,tensorboard-gateway,inference-runtime,backend,frontend,nginx,mailpit,notification-receiver
      SSL_CERT_FILE: /run/secrets/notification_acceptance_ca
      NOTIFICATION_WEBHOOK_ALLOWLIST: notification-receiver
      NOTIFICATION_TEST_WEBHOOK_URL: https://notification-receiver/events
      NOTIFICATION_TEST_WECOM_URL: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=acceptance-controlled
      NOTIFICATION_TEST_RECEIVER_EVENTS_URL: http://notification-receiver:8080/events
    depends_on:
      mailpit:
        condition: service_healthy
      notification-receiver:
        condition: service_started
      notification-proxy:
        condition: service_started
    secrets:
      - notification_master_key
      - notification_acceptance_ca

  worker:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ml-platform-acceptance@localhost
      SMTP_USE_TLS: "false"
      HTTPS_PROXY: http://notification-proxy:3128
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,mlflow,tensorboard-gateway,inference-runtime,backend,frontend,nginx,mailpit,notification-receiver
      SSL_CERT_FILE: /run/secrets/notification_acceptance_ca
      NOTIFICATION_WEBHOOK_ALLOWLIST: notification-receiver
    depends_on:
      mailpit:
        condition: service_healthy
      notification-receiver:
        condition: service_started
      notification-proxy:
        condition: service_started
    secrets:
      - notification_master_key
      - notification_acceptance_ca

  scheduler:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ml-platform-acceptance@localhost
      SMTP_USE_TLS: "false"
    depends_on:
      mailpit:
        condition: service_healthy

  notification-receiver:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - python
      - -m
      - tools.notification_receiver
      - serve
      - --https-port
      - "443"
      - --events-port
      - "8080"
      - --certificate
      - /run/secrets/notification_receiver_certificate
      - --private-key
      - /run/secrets/notification_receiver_private_key
    expose:
      - "443"
      - "8080"
    ports:
      - "127.0.0.1:${WEEK12_RECEIVER_EVENTS_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/events', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - notification_receiver_certificate
      - notification_receiver_private_key
    restart: "no"

  notification-proxy:
    build:
      context: ./ml-platform/backend
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - tools.notification_receiver
      - proxy
      - --listen-port
      - "3128"
      - --target-host
      - notification-receiver
      - --target-port
      - "443"
      - --allowed-host
      - qyapi.weixin.qq.com
    expose:
      - "3128"
    depends_on:
      notification-receiver:
        condition: service_started
    healthcheck:
      disable: true
    restart: "no"

secrets:
  notification_acceptance_ca:
    file: ${NOTIFICATION_ACCEPTANCE_CA_FILE:?set NOTIFICATION_ACCEPTANCE_CA_FILE}
  notification_receiver_certificate:
    file: ${NOTIFICATION_RECEIVER_CERTIFICATE_FILE:?set NOTIFICATION_RECEIVER_CERTIFICATE_FILE}
  notification_receiver_private_key:
    file: ${NOTIFICATION_RECEIVER_PRIVATE_KEY_FILE:?set NOTIFICATION_RECEIVER_PRIVATE_KEY_FILE}
