name: Cross-platform quality gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-platform/backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ml-platform/frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: ml-platform/backend
        run: python -m pip install -r requirements.txt
      - name: Install optional PyTorch CPU backend
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install frontend dependencies
        working-directory: ml-platform/frontend
        run: npm ci
      - name: Run backend suite
        working-directory: ml-platform/backend
        run: python run_suite.py
      - name: Run frontend tests
        working-directory: ml-platform/frontend
        run: npm test
      - name: Build frontend
        working-directory: ml-platform/frontend
        run: npm run build
      - name: Windows service smoke test
        if: runner.os == 'Windows'
        working-directory: ml-platform
        shell: pwsh
        run: |
          try {
            ./scripts/start.ps1
            ./scripts/health-check.ps1
            $login = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/auth/login -ContentType application/x-www-form-urlencoded -Body 'username=admin&password=admin123'
            if (-not $login.access_token) { throw 'Login failed.' }
          } finally {
            ./scripts/stop.ps1
          }
      - name: Ubuntu service smoke test
        if: runner.os == 'Linux'
        working-directory: ml-platform
        shell: bash
        run: |
          chmod +x scripts/*.sh
          trap './scripts/stop.sh' EXIT
          ./scripts/start.sh
          ./scripts/health-check.sh
          curl --fail --silent --request POST http://127.0.0.1:8000/api/auth/login \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data 'username=admin&password=admin123' | grep -q access_token

  browser-acceptance:
    name: Chromium acceptance (Ubuntu)
    runs-on: ubuntu-22.04
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-platform/backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ml-platform/frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: ml-platform/backend
        run: python -m pip install -r requirements.txt
      - name: Install optional PyTorch CPU backend
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install frontend dependencies
        working-directory: ml-platform/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: ml-platform/frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare browser runtime directories
        working-directory: ml-platform/frontend
        run: mkdir -p ../../temp_test
      - name: Run browser acceptance
        working-directory: ml-platform/frontend
        env:
          DATABASE_URL: sqlite:///../../temp_test/playwright_ci.db
          ARTIFACT_STORAGE_DIR: ../../temp_test/playwright-artifacts
          ML_PLATFORM_TEMP_DIR: ../../temp_test/playwright-data
        run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            temp_test/playwright-report
            temp_test/playwright-test-results
          if-no-files-found: ignore

  production-integration:
    name: Production integration (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: ml_platform
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d ml_platform"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_MODE: production
      DATABASE_URL: postgresql+psycopg://postgres:test-password@127.0.0.1:5432/ml_platform
      SECRET_KEY: ci-production-secret-key-with-at-least-32-characters
      TASK_BACKEND: celery
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
      REDIS_EVENTS_URL: redis://127.0.0.1:6379/1
      ARTIFACT_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_BUCKET: ml-platform-test
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin-secret
      RUN_PRODUCTION_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-platform/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: ml-platform/backend
        run: python -m pip install -r requirements.txt
      - name: Start MinIO
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ml-platform-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:latest server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ml-platform-minio
          exit 1
      - name: Create MinIO bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://127.0.0.1:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          /tmp/mc mb --ignore-existing local/$MINIO_BUCKET
      - name: Upgrade production schema
        working-directory: ml-platform/backend
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current
          alembic check
      - name: Start Celery worker
        working-directory: ml-platform/backend
        env:
          ML_PLATFORM_TEMP_DIR: ${{ runner.temp }}/ml-platform-production
        run: |
          nohup celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=2 > "$RUNNER_TEMP/celery.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/celery.pid"
      - name: Wait for Celery worker
        working-directory: ml-platform/backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if celery -A app.tasks.celery_app:celery_app inspect --timeout=2 ping | grep -q pong; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/celery.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/celery.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/celery.log"
          exit 1
      - name: Run production integration tests
        working-directory: ml-platform/backend
        env:
          ML_PLATFORM_TEMP_DIR: ${{ runner.temp }}/ml-platform-production
        run: python -m unittest tests.test_production_stack -v
      - name: Scan and upload production failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-evidence"
          for file in "$RUNNER_TEMP/celery.log" "$RUNNER_TEMP/celery.pid"; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/production-evidence/"; fi
          done
          docker logs ml-platform-minio > "$RUNNER_TEMP/production-evidence/minio.log" 2>&1 || true
          sed -i 's/test-password/[redacted]/g; s/minioadmin-secret/[redacted]/g; s/ci-production-secret-key-with-at-least-32-characters/[redacted]/g' "$RUNNER_TEMP/production-evidence"/* 2>/dev/null || true
          if rg -n -i 'test-password|minioadmin-secret|ci-production-secret-key|redis://[^/@[:space:]]+@' "$RUNNER_TEMP/production-evidence"; then
            echo 'Sensitive value found in production evidence.'
            rm -rf "$RUNNER_TEMP/production-evidence"
            exit 1
          fi
      - name: Upload production failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-integration-failure-evidence
          path: ${{ runner.temp }}/production-evidence
          if-no-files-found: ignore
      - name: Stop Celery worker
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/celery.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/celery.pid")" 2>/dev/null || true
          fi
          docker rm --force ml-platform-minio 2>/dev/null || true
