<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闭环自动化运行大屏 · 推理-回流-告警-重训-换模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05080f; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #d7e6f5; }

  #viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1600px; height: 900px; transform-origin: center center; flex: none; }
  #bg { position: absolute; inset: 0; width: 1600px; height: 900px; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(2, 5, 12, .75) 100%); }

  /* ================= 节点基座 ================= */
  .node {
    position: absolute; width: 196px; height: 82px; margin: -41px 0 0 -98px;
    border-radius: 14px; border: 1.5px solid var(--c);
    background: linear-gradient(160deg, rgba(13, 24, 46, .95), rgba(8, 15, 30, .95));
    box-shadow: inset 0 0 18px rgba(255,255,255,.03);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .18s ease, box-shadow .25s ease, filter .25s ease;
    cursor: default; z-index: 3;
    animation: nodeIn .55s cubic-bezier(.2, 1.4, .4, 1) backwards;
  }
  @keyframes nodeIn { from { opacity: 0; transform: scale(.55) translateY(14px); } }
  .node:hover { transform: translateY(-3px); }
  .node.active { transform: scale(1.07); filter: drop-shadow(0 0 16px var(--c)); }
  .node .txt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
  .node .title { font-size: 16px; font-weight: 800; letter-spacing: 1.5px; color: #eef6ff;
    text-shadow: 0 0 12px color-mix(in srgb, var(--c) 70%, transparent); white-space: nowrap; }
  .node .sub { font-size: 10.5px; color: #8fa8c4; letter-spacing: .5px; white-space: nowrap; }
  .node .icon { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; }
  .node .icon svg { width: 40px; height: 40px; overflow: visible; }
  .node .badge { position: absolute; top: -13px; right: -10px; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 800; color: #071018; background: var(--c);
    box-shadow: 0 0 14px var(--c); z-index: 4; }
  .node .badge.hidden { display: none; }
  .node.flip .inner { animation: flipIn .8s ease; }
  .node .inner { display: flex; align-items: center; gap: 10px; }
  @keyframes flipIn { 0% { transform: rotateY(90deg); opacity: .2; } 100% { transform: rotateY(0); opacity: 1; } }

  /* ================= 各节点专属造型 ================= */
  /* 1 数据上传：顶部跑马灯边框 + 云上传 */
  .n-upload { border-style: solid; overflow: hidden; }
  .n-upload::before { content: ""; position: absolute; top: 0; left: -60%; width: 45%; height: 3px;
    background: linear-gradient(90deg, transparent, var(--c), transparent);
    animation: marquee 2.6s linear infinite; }
  @keyframes marquee { to { left: 110%; } }
  .cloud-arrow { animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }

  /* 2 逐行调用：终端窗口 */
  .n-invoke { border-radius: 7px; padding-top: 15px; }
  .n-invoke .term-bar { position: absolute; top: 0; left: 0; right: 0; height: 15px; border-radius: 6px 6px 0 0;
    background: rgba(47, 155, 245, .16); display: flex; align-items: center; gap: 4px; padding: 0 7px; }
  .term-bar i { width: 6px; height: 6px; border-radius: 50%; background: #2f9bf5; opacity: .8; }
  .term-bar i:nth-child(2) { background: #d9ac52; } .term-bar i:nth-child(3) { background: #e66f75; }
  .term-line { position: absolute; left: 14px; bottom: 7px;
    font: 700 10.5px Consolas, monospace; color: #6fd3a5; letter-spacing: .5px; overflow: hidden;
    white-space: nowrap; width: 0; border-right: 5px solid #47c3a0;
    animation: typing 2.8s steps(16) infinite; }
  @keyframes typing { 0% { width: 0 } 55% { width: 118px } 90% { width: 118px; border-color: transparent } 100% { width: 0 } }

  /* 3 特征工程：旋转齿轮 */
  .gear { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
  .node.active .gear { animation-duration: 1.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .feat-chip { position: absolute; top: -10px; left: -8px; padding: 1px 7px; border-radius: 7px;
    font: 800 10px Consolas, monospace; color: #9fd4ff; background: rgba(47,155,245,.18);
    border: 1px solid rgba(47,155,245,.55); animation: blink 2.4s ease infinite; }
  @keyframes blink { 50% { opacity: .45; } }

  /* 4 模型推理：芯片 */
  .n-infer { border-radius: 10px; }
  .n-infer::before, .n-infer::after { content: ""; position: absolute; top: 14px; bottom: 14px; width: 5px;
    background: repeating-linear-gradient(180deg, var(--c) 0 5px, transparent 5px 11px); opacity: .8; }
  .n-infer::before { left: -7px; border-radius: 2px 0 0 2px; }
  .n-infer::after { right: -7px; border-radius: 0 2px 2px 0; }
  .core { animation: corePulse 1.8s ease-in-out infinite; }
  @keyframes corePulse { 50% { opacity: .35; } }

  /* 5 分类判断：六边形剪影 + 双灯 */
  .n-decide { border: none; border-radius: 0; background: none;
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 45%, transparent)); }
  .n-decide .hex { position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(160deg, rgba(16, 34, 64, .97), rgba(8, 16, 32, .97));
    clip-path: polygon(14% 0, 86% 0, 100% 50%, 86% 100%, 14% 100%, 0 50%); }
  .n-decide .hexline { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .lamp { width: 9px; height: 9px; border-radius: 50%; background: #22304a; border: 1px solid #37507a; }
  .lamp.ok { background: #47c3a0; box-shadow: 0 0 9px #47c3a0; border-color: transparent; }
  .lamp.err { background: #e66f75; box-shadow: 0 0 9px #e66f75; border-color: transparent; }

  /* 6 错误回流：粗红左边 + 回旋箭头 */
  .n-backflow { border-left: 4px solid var(--c); border-radius: 6px 14px 14px 6px; }
  .flow-dash { stroke-dasharray: 5 6; animation: dashflow 1.6s linear infinite; }
  @keyframes dashflow { to { stroke-dashoffset: -22; } }

  /* 7 报错数据集：数据库圆柱 + 数字计数 */
  .n-dataset { border-radius: 10px; }
  .ds-count { font: 800 21px Consolas, monospace; color: #ff8f97; text-shadow: 0 0 12px rgba(230,111,117,.8);
    line-height: 1; font-variant-numeric: tabular-nums; }
  .ds-unit { font-size: 10px; color: #b98; margin-left: 3px; }
  .stackbar { display: flex; gap: 2.5px; align-items: flex-end; height: 10px; margin-top: 3px; }
  .stackbar i { width: 5px; background: #e66f75; border-radius: 1.5px; opacity: .85; }

  /* 8 阈值监测：仪表盘 */
  .gauge-fill { transition: stroke-dashoffset .5s ease; }

  /* 9 告警通知：铃铛 */
  .bell { transform-box: fill-box; transform-origin: 50% 8%; }
  .node.active .bell { animation: swing .5s ease-in-out 4; }
  @keyframes swing { 25% { transform: rotate(16deg); } 75% { transform: rotate(-16deg); } }
  .alert-count { position: absolute; top: -9px; left: -9px; min-width: 18px; height: 18px; padding: 0 4px;
    border-radius: 9px; background: #e66f75; color: #fff; font: 800 10.5px/18px Consolas, monospace;
    text-align: center; box-shadow: 0 0 10px #e66f75; }
  .alert-count.zero { display: none; }

  /* 10 人工审核：清单 */
  .check-draw { stroke-dasharray: 26; stroke-dashoffset: 26; }
  .node.active .check-draw { animation: draw .8s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .clip-lines i { display: block; height: 3.5px; border-radius: 2px; background: #d9ac52; opacity: .55; margin: 3.5px 0; }
  .clip-lines i:nth-child(2) { width: 72%; } .clip-lines i:nth-child(3) { width: 50%; }

  /* 11 自动建模：轨道粒子 */
  .orbit { position: relative; width: 44px; height: 44px; }
  .orbit .ring { position: absolute; inset: 6px; border: 1px dashed rgba(155, 123, 255, .5); border-radius: 50%; }
  .orbit .sat { position: absolute; inset: 0; animation: orbit 2.6s linear infinite; }
  .orbit .sat.s2 { animation-duration: 4s; animation-direction: reverse; }
  .orbit .sat::before { content: ""; position: absolute; top: -2.5px; left: 50%; width: 6px; height: 6px;
    margin-left: -3px; border-radius: 50%; background: #b79bff; box-shadow: 0 0 8px #b79bff; }
  .node.active .orbit .sat { animation-duration: .9s; }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* 12 模型替换：双向换箭 */
  .swap-arrows { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
  .node.active .swap-arrows { animation-duration: 1.1s; }

  /* 13 重训阈值：圆形判断体 + 进度环 */
  .n-gate { width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%;
    flex-direction: column; gap: 0; }
  .n-gate .inner { flex-direction: column; gap: 1px; }
  .n-gate .title { font-size: 13px; letter-spacing: 1px; }
  .n-gate .gate-count { font: 800 14px Consolas, monospace; color: #c9b2ff;
    text-shadow: 0 0 10px rgba(155, 123, 255, .7); font-variant-numeric: tabular-nums; }
  .gate-ring { position: absolute; inset: -2px; pointer-events: none; }
  .gate-ring .fill { transition: stroke-dashoffset .5s ease; }

  /* ================= HUD / 标题 / 控制 ================= */
  #hud { position: absolute; top: 18px; right: 20px; z-index: 5; display: flex; gap: 10px; }
  .stat { min-width: 104px; padding: 10px 14px 8px; border-radius: 12px;
    background: rgba(10, 20, 40, .78); border: 1px solid rgba(90, 140, 200, .25); backdrop-filter: blur(6px); }
  .stat .k { font-size: 10px; color: #7d95b5; letter-spacing: 2px; }
  .stat .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat.blue .v { color: #5cb2ff; } .stat.green .v { color: #47c3a0; }
  .stat.red .v { color: #ff7b85; } .stat.orange .v { color: #ffc861; }
  .stat.gold .v { color: #ffd166; } .stat.purple .v { color: #b79bff; }

  #titlebar { position: absolute; top: 18px; left: 24px; z-index: 5; }
  #titlebar h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #eaf4ff; }
  #titlebar h1 em { font-style: normal; color: #ffd166; text-shadow: 0 0 16px rgba(255, 209, 102, .65); }
  #titlebar .tagline { margin-top: 4px; font-size: 12px; color: #6f89a8; letter-spacing: 3px; }

  #controls { position: absolute; left: 24px; bottom: 18px; z-index: 6; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 14px; background: rgba(10, 20, 40, .82);
    border: 1px solid rgba(90, 140, 200, .25); backdrop-filter: blur(6px); }
  #controls button, #controls select, #controls input {
    background: rgba(23, 42, 76, .9); color: #d7e6f5; border: 1px solid rgba(90, 140, 200, .35);
    border-radius: 9px; padding: 6px 12px; font-size: 12px; outline: none; cursor: pointer; }
  #controls button:hover { border-color: #5cb2ff; box-shadow: 0 0 10px rgba(92, 178, 255, .35); }
  #controls button.primary { background: linear-gradient(160deg, #1d4ed8, #2f9bf5); border: none; font-weight: 700; }
  #controls input { cursor: text; width: 210px; }
  #controls .sep { width: 1px; height: 22px; background: rgba(90, 140, 200, .3); }
  #livePanel { display: none; align-items: center; gap: 8px; }
  #livePanel.open { display: flex; }
  #liveProject { max-width: 240px; }
  #connDot { width: 9px; height: 9px; border-radius: 50%; background: #556; }
  #connDot.on { background: #47c3a0; box-shadow: 0 0 8px #47c3a0; }
  #connDot.off { background: #e66f75; box-shadow: 0 0 8px #e66f75; }

  #toasts { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 8;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { padding: 9px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: 1px;
    color: #eaf4ff; background: rgba(12, 24, 46, .92); border: 1px solid var(--tc, #2f9bf5);
    box-shadow: 0 0 18px color-mix(in srgb, var(--tc, #2f9bf5) 45%, transparent);
    animation: toastIn .35s ease; transition: opacity .5s, transform .5s; }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.92); } }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <canvas id="bg" width="1600" height="900"></canvas>
  <div id="vignette"></div>

  <div id="titlebar">
    <h1>推理 · 回流 · 告警 · <em>重训闭环</em></h1>
    <div class="tagline">CLOSED-LOOP MLOPS SHOWCASE</div>
  </div>

  <div id="hud">
    <div class="stat blue"><div class="k">已推理</div><div class="v" id="stInvoked">0</div></div>
    <div class="stat green"><div class="k">正常通过</div><div class="v" id="stOk">0</div></div>
    <div class="stat red"><div class="k">报错回流</div><div class="v" id="stErrors">0</div></div>
    <div class="stat orange"><div class="k">管理员告警</div><div class="v" id="stAlerts">0</div></div>
    <div class="stat gold"><div class="k">线上模型</div><div class="v" id="stVersion">v1</div></div>
    <div class="stat purple"><div class="k">预估准确率</div><div class="v" id="stAcc">86.4%</div></div>
  </div>

  <div id="nodes"></div>
  <div id="toasts"></div>

  <div id="controls">
    <button id="btnPlay" class="primary">⏸ 暂停</button>
    <button id="btnReset">↻ 重置</button>
    <div class="sep"></div>
    <span style="font-size:11px;color:#7d95b5">速度</span>
    <button class="spd" data-s="1" style="border-color:#5cb2ff">×1</button>
    <button class="spd" data-s="2">×2</button>
    <button class="spd" data-s="4">×4</button>
    <div class="sep"></div>
    <button id="btnMode">模式：模拟</button>
    <div id="livePanel">
      <span id="connDot"></span>
      <select id="liveProject"><option value="">加载项目...</option></select>
      <select id="liveLoop"><option value="">闭环任务...</option></select>
      <input id="liveToken" placeholder="Token（留空自动读取本浏览器登录）">
      <button id="btnConnect">连接</button>
    </div>
  </div>
</div></div>

<script>
"use strict";
/* ================= 布局与调色 ================= */
const W = 1600, H = 900;
const C = { blue:"#2f9bf5", green:"#47c3a0", red:"#e66f75", orange:"#d9ac52", purple:"#9b7bff", gold:"#ffd166" };

const SVGS = {

  features: `<svg viewBox="0 0 40 40" fill="none">
    <g class="gear">
      <path d="M20 8l2.2 3.4 4-1 1 4L31 16l-1.6 3.7L32 23l-3.4 2.2 1 4-4 1L23 34l-3-2.2L17 34l-2.2-3.4-4 1-1-4L6 25l1.6-3.7L5 18l3.4-2.2-1-4 4-1L14 7l3 2.2z" stroke="#2f9bf5" stroke-width="1.8" stroke-linejoin="round"/>

    <g class="bell">
      <path d="M20 6a9 9 0 0 1 9 9v6l2.6 4.4a1.4 1.4 0 0 1-1.2 2.1H9.6a1.4 1.4 0 0 1-1.2-2.1L11 21v-6a9 9 0 0 1 9-9z" stroke="#d9ac52" stroke-width="2.2" stroke-linejoin="round"/>

  </svg>`,
  automl: `<svg viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="4" fill="#b79bff"/>
    <path d="M20 12v3m0 10v3m8-8h-3m-10 0h-3m13.7-5.7-2.1 2.1M14.4 25.6l-2.1 2.1m0-15.4 2.1 2.1m11.2 11.2-2.1-2.1" stroke="#9b7bff" stroke-width="1.8" stroke-linecap="round"/>

    </g>
    <circle cx="20" cy="20" r="3" fill="#ffd166"/>
  </svg>`,
};

const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px"; ctx.scale(dpr, dpr);

function pathPoint(e, t) {
  const p = e.path;
  if (p.length === 2) {
    const [a, b] = p;
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  const [a, c, b] = p, u = 1 - t;
  return [u*u*a[0] + 2*u*t*c[0] + t*t*b[0], u*u*a[1] + 2*u*t*c[1] + t*t*b[1]];
}
const EDGES = [

  { id: "e14", path: [[1105, 478], [770, 790], [537, 780]],          c: C.purple, w: 1.8, label: "报错数据积累" },
  { id: "e15", path: [[435, 780], [300, 764], [186, 692]],           c: C.purple, w: 2, label: "达标 · 触发建模" },
  { id: "e16", path: [[485, 728], [690, 800], [1058, 484]],          c: "#6b5a9e", w: 1.4, label: "未达标 · 继续积累", dash: [5, 8] },

function traceEdge(e) {
  const p = e.path; ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
  if (p.length === 2) ctx.lineTo(p[1][0], p[1][1]);
  else ctx.quadraticCurveTo(p[1][0], p[1][1], p[2][0], p[2][1]);
}
let flowT = 0;
function drawEdges(dt) {
  flowT += dt * 30;
  ctx.save(); ctx.lineCap = "round";
  for (const e of EDGES) {
    ctx.strokeStyle = e.c; ctx.globalAlpha = .22; ctx.lineWidth = e.w;
    traceEdge(e); ctx.stroke();
    /* 流动虚线 */
    ctx.globalAlpha = .55; ctx.lineWidth = e.w;
    ctx.setLineDash(e.dash || [4, 13]); ctx.lineDashOffset = -flowT;
    traceEdge(e); ctx.stroke(); ctx.setLineDash([]);
    if (e.label) {
      const [lx, ly] = pathPoint(e, .5);
      ctx.globalAlpha = .9; ctx.font = "600 11px system-ui";
      ctx.textAlign = "center"; ctx.fillStyle = e.c;
      ctx.shadowColor = e.c; ctx.shadowBlur = 8;
      ctx.fillText(e.label, lx, (e.id === "e5" || e.id === "e13") ? Math.max(ly, 26) : ly - 8);
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}
const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, s: Math.random() * .15 + .04 }));
function drawBackground(dt) {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#060b16"); g.addColorStop(.55, "#081222"); g.addColorStop(1, "#050912");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.strokeStyle = "rgba(80,130,190,.06)"; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (const s of stars) {
    s.y += s.s * dt * 60; if (s.y > H) s.y = 0;
    ctx.globalAlpha = .35 + Math.sin(s.x) * .2; ctx.fillStyle = "#9fc4ff";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ================= 粒子 ================= */
const particles = [];
function spawn(edgeId, color, opts = {}) {
  const e = EDGES.find(x => x.id === edgeId); if (!e) return null;
  const p = { e, t: 0, speed: opts.speed || 1, color: color || e.c, size: opts.size || 4.5,
              trail: [], onArrive: opts.onArrive, glow: opts.glow || 0 };
  particles.push(p); return p;
}
const HIT_NODE = { e1:"invoke", e2:"features", e3:"infer", e4:"decide", e5:"invoke", e6:"backflow",
                   e7:"dataset", e8:"monitor", e9:"alert", e10:"review", e11:"automl",
                   e12:"swap", e13:"infer", e14:"gate", e15:"automl", e16:"dataset" };
function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt * .55 * p.speed;
    if (p.t >= 1) {
      particles.splice(i, 1);
      if (p.onArrive) p.onArrive();
      continue;
    }
    const [x, y] = pathPoint(p.e, p.t);
    p.trail.push([x, y]); if (p.trail.length > 16) p.trail.shift();
    ctx.save();
    ctx.lineCap = "round";
    for (let k = 1; k < p.trail.length; k++) {
      const a = k / p.trail.length;
      ctx.strokeStyle = p.color; ctx.globalAlpha = a * .5; ctx.lineWidth = p.size * a * 1.1;
      ctx.beginPath(); ctx.moveTo(p.trail[k - 1][0], p.trail[k - 1][1]); ctx.lineTo(p.trail[k][0], p.trail[k][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.fillStyle = "#fff";
    ctx.shadowColor = p.color; ctx.shadowBlur = 14 + p.glow * 16;
    ctx.beginPath(); ctx.arc(x, y, p.size, 0, 7); ctx.fill();
    ctx.globalAlpha = .85; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(x, y, p.size * 1.9, 0, 7); ctx.fill();
    ctx.restore();
    if (p.t > .96 && !p._hit) {
      const target = HIT_NODE[p.e.id];
      if (target) { pulse(target, 500); p._hit = true; }
    }
  }
}
const waves = [];
function shockwave(x, y, color) { waves.push({ x, y, r: 10, color }); }
function drawWaves(dt) {
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i]; w.r += dt * 340;
    if (w.r > 300) { waves.splice(i, 1); continue; }
    ctx.save(); ctx.strokeStyle = w.color; ctx.globalAlpha = Math.max(0, 1 - w.r / 300) * .8;
    ctx.lineWidth = 3; ctx.shadowColor = w.color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, 7); ctx.stroke(); ctx.restore();
  }
}

/* ================= HUD ================= */
const hud = { invoked: 0, ok: 0, errors: 0, alerts: 0, version: 1, acc: 86.4 };
const shown = { ...hud };
function setHud(k, v) { hud[k] = v; }
function renderHud(dt) {
  for (const k of Object.keys(shown)) {
    const target = hud[k], cur = shown[k];
    if (typeof target === "number" && typeof cur === "number" && Math.abs(target - cur) > .001) {
      shown[k] = cur + (target - cur) * Math.min(1, dt * 6);
    } else shown[k] = target;
  }
  document.getElementById("stInvoked").textContent = Math.round(shown.invoked);
  document.getElementById("stOk").textContent = Math.round(shown.ok);
  document.getElementById("stErrors").textContent = Math.round(shown.errors);
  document.getElementById("stAlerts").textContent = Math.round(shown.alerts);
  document.getElementById("stVersion").textContent = "v" + Math.round(hud.version);
  document.getElementById("stAcc").textContent = shown.acc.toFixed(1) + "%";
}
function toast(msg, color = C.blue, ms = 2600) {
  const box = document.getElementById("toasts");

}

const sim = {

function resetSim() {
  Object.assign(sim, { invoked: 0, ok: 0, errors: 0, alerts: 0, dataset: 0, version: 1,
    retrainAt: 12, retrain: "idle", retrainT: 0, accuracy: 86.4, rowTimer: .5 });

  setBadge("infer", "v1"); setBadge("swap", null); setAlertCount(0);
  updateDatasetVisual(0, sim.alertEvery);
  updateGateVisual();
  NODES.infer.el.classList.remove("flip");
  document.getElementById("sub_infer").textContent = "ONNX 运行时";
}
function runRow(visualOnly = false) {
  sim.invoked++;
  setHud("invoked", sim.invoked);
  pulse("upload", 400);
  spawn("e1", C.blue, { speed: 1.6, onArrive: () => {
    spawn("e2", C.blue, { speed: 1.6, onArrive: () => {
      spawn("e3", C.blue, { speed: 1.6, onArrive: () => {
        spawn("e4", C.blue, { speed: 1.6, onArrive: () => {
          if (visualOnly) { spawn("e5", C.green, { speed: 1.9, size: 3.6 }); return; }
          decide();
        }});
      }});
    }});
  }});
}
function decide() {
  const isError = Math.random() < .32;
  setDecision(isError);
  if (!isError) {
    sim.ok++; setHud("ok", sim.ok);
    spawn("e5", C.green, { speed: 1.9, size: 3.6 });
  } else {
    spawn("e6", C.red, { speed: 1.5, size: 5, glow: 1, onArrive: () => {
      sim.errors++; sim.dataset++; setHud("errors", sim.errors);
      updateDatasetVisual(sim.dataset, sim.alertEvery);
      updateGateVisual();
      /* 告警在回流落账瞬间判定（与后端语义一致），粒子随后沿监测链流动 */
      const alertNow = sim.dataset % sim.alertEvery === 0;
      spawn("e7", C.red, { speed: 1.7, onArrive: () => {
        spawn("e8", C.red, { speed: 1.7, onArrive: () => {
          pulse("monitor", 500);
          if (alertNow) {
            sim.alerts++; setHud("alerts", sim.alerts); setAlertCount(sim.alerts);
            toast(`管理员告警已发送（报错累计 ${sim.dataset} 行）`, C.orange);
            spawn("e9", C.orange, { speed: 1.4, onArrive: () => {
              spawn("e10", C.orange, { speed: 1.6, onArrive: () => {
                spawn("e11", C.orange, { speed: 1.6, onArrive: () => {
                  toast("人工审核任务已创建并分配标注员", C.orange);
                }});
              }});
            }});
          }
          /* 每条报错数据都要经过重训阈值判断 */
          spawn("e14", C.purple, { speed: 1.1, size: 4, onArrive: () => gateCheck() });
        }});
      }});
    }});
  }
}
function updateGateVisual() {
  const total = 301.6;
  const progress = Math.min(1, sim.dataset / Math.max(1, sim.retrainAt));
  const arc = document.getElementById("gateArc");
  if (arc) arc.style.strokeDashoffset = String(total * (1 - progress));
  const count = document.getElementById("gateCount");
  if (count) count.textContent = `${sim.dataset} / ${sim.retrainAt}`;
}
function gateCheck() {
  updateGateVisual();
  pulse("gate", 700);
  if (sim.dataset >= sim.retrainAt && sim.retrain === "idle") {
    spawn("e15", C.purple, { speed: 1.2, size: 5, glow: 1, onArrive: () => startRetrain() });
  } else {
    spawn("e16", "#6b5a9e", { speed: 1.3, size: 3, onArrive: () => {} });
  }
}
function startRetrain() {
  sim.retrain = "running"; sim.retrainT = 0;
  toast(`报错数据达 ${sim.dataset} 行，达到重训阈值，自动建模已触发（AutoML）`, C.purple, 3000);
  for (let i = 0; i < 4; i++) {
    setTimeout(() => { if (sim.playing) spawn("e15", C.purple, { speed: 1, size: 3.2 }); }, i * 380 / sim.speed);
  }
}
function finishRetrain() {
  sim.retrain = "done";
  toast("AutoML 完成 · 最优候选已注册并批准", C.purple, 3000);
  setBadge("swap", "v" + (sim.version + 1));
  spawn("e12", C.purple, { speed: 1.3, size: 5.5, glow: 1, onArrive: () => {
    spawn("e13", C.gold, { speed: 1.15, size: 6, glow: 1, onArrive: () => applySwap() });
  }});
}
function applySwap() {
  sim.version++; setHud("version", sim.version);
  sim.accuracy = Math.min(97.5, sim.accuracy + 2.6 + Math.random()); setHud("acc", sim.accuracy);
  sim.retrainAt = sim.dataset + 12; sim.retrain = "idle";
  updateGateVisual();
  NODES.infer.el.classList.remove("flip"); void NODES.infer.el.offsetWidth; NODES.infer.el.classList.add("flip");

  document.getElementById("sub_infer").textContent = "ONNX 运行时 · 已热更新";
  shockwave(NODES.infer.x, NODES.infer.y, C.gold);
  shockwave(NODES.infer.x, NODES.infer.y, "#ffffff");

  setTimeout(() => { document.getElementById("sub_infer").textContent = "ONNX 运行时"; }, 5200);
}

/* 项目变化时加载该项目的闭环任务列表 */
async function loadLiveLoops(project) {
  const sel = document.getElementById("liveLoop");
  sel.innerHTML = `<option value="">（加载闭环任务...）</option>`;
  if (!project) { sel.innerHTML = `<option value="">（请先选择项目）</option>`; return; }
  try {
    const res = await fetch(`/api/projects/${project}/demo-loop/loops`, { headers: liveHeaders() });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) { sel.innerHTML = `<option value="">（该项目暂无闭环任务，请先在闭环页创建）</option>`; live.loopId = null; return; }
    sel.innerHTML = items.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
    const saved = localStorage.getItem("demoLiveLoop");
    if (saved && items.some(l => l.id === saved)) sel.value = saved;
    live.loopId = sel.value;
  } catch (e) {
    sel.innerHTML = `<option value="">（任务加载失败：请先在主界面登录）</option>`;
    live.loopId = null;
  }
}
async function liveConnect() {
  const project = document.getElementById("liveProject").value;
  const loopId = document.getElementById("liveLoop").value || live.loopId;
  if (!project) { toast("请先选择项目（加载失败时请检查是否已在主界面登录）", C.red, 3200); return; }
  if (!loopId) { toast("该项目的闭环任务为空，请先在「自动化闭环」页创建任务", C.red, 3200); return; }
  live.project = project;
  live.loopId = loopId;
  live.synced = false;            /* 首连只同步计数与水位线，不回放历史动画 */
  live.lastEventId = null;
  localStorage.setItem("demoLiveProject", project);
  localStorage.setItem("demoLiveLoop", loopId);
  clearInterval(live.timer);
  /* 读取该任务的真实配置，驱动阈值环 */
  try {
    const cfgRes = await fetch(`/api/projects/${project}/demo-loop/loops/${loopId}`, { headers: liveHeaders() });
    if (cfgRes.ok) {
      const cfg = await cfgRes.json();
      if (cfg.retrain_threshold_rows > 0) sim.retrainAt = cfg.retrain_threshold_rows;
      updateGateVisual();
    }
  } catch (e) { /* 阈值环保持默认值 */ }
  const poll = async () => {
    try {
      const res = await fetch(`/api/projects/${project}/demo-loop/loops/${loopId}/status`, {
        headers: liveHeaders(),
      });
      if (!res.ok) throw new Error(String(res.status));
      const st = await res.json();
      document.getElementById("connDot").className = "on";
      applyLiveStatus(st);
    } catch (e) {
      document.getElementById("connDot").className = "off";
    }
  };
  await poll();
  live.timer = setInterval(poll, 100);
  live.on = true;
  const sel2 = document.getElementById("liveProject");
  const loopSel = document.getElementById("liveLoop");
  const pname = sel2.selectedOptions[0] ? sel2.selectedOptions[0].textContent : project;
  const lname = loopSel.selectedOptions[0] ? loopSel.selectedOptions[0].textContent : "";
  toast(`已连接实时闭环 · ${pname} / ${lname}`, C.green);
}
/* 拉取当前登录用户可见的项目列表填充下拉框 */
async function loadLiveProjects() {
  const sel = document.getElementById("liveProject");
  sel.innerHTML = `<option value="">加载项目...</option>`;
  try {
    const res = await fetch("/api/projects", { headers: liveHeaders() });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) { sel.innerHTML = `<option value="">（当前账号没有可见项目）</option>`; return; }
    sel.innerHTML = items.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
    const saved = localStorage.getItem("demoLiveProject");
    if (saved && items.some(p => p.id === saved)) sel.value = saved;
    else sel.value = items[0].id;
    loadLiveLoops(sel.value);
  } catch (e) {
    sel.innerHTML = `<option value="">（加载失败：请先在主界面登录或粘贴 Token）</option>`;
  }
}
function applyLiveStatus(st) {
  const total = st.total_count || 0;
  const errors = st.error_count || 0;
  const okCount = Math.max(0, total - errors);
  // 已推理/正常通过按真实条数直读状态（total=推理行数，ok=未报错行数）。
  // 直写 DOM：rAF 缓动在页面后台/未聚焦时会被暂停，数字会冻结。
  const setNow = (k, v) => { hud[k] = v; shown[k] = v;
    const map = { invoked: "stInvoked", ok: "stOk", errors: "stErrors", alerts: "stAlerts" };
    const el = document.getElementById(map[k]);
    if (el) el.textContent = Math.round(v); };
  setNow("invoked", total); sim.invoked = total;
  setNow("ok", okCount); sim.ok = okCount;
  setNow("errors", errors);
  setNow("alerts", st.alert_count || 0);
  sim.alerts = st.alert_count || 0;
  sim.dataset = errors;
  updateDatasetVisual(errors, sim.alertEvery);
  updateGateVisual();
  setAlertCount(st.alert_count || 0);
  const events = st.events || [];
  if (!live.synced) {
    /* 首次同步：只落水位线，历史事件不回放动画 */
    live.lastEventId = events.length ? events[0].id : null;
    live.synced = true;
    return;
  }
  /* 事件按时间倒序返回：遇到上次回放的水位线即可停止，UUID 不能作时间比较 */
  for (const ev of events) {
    if (live.lastEventId && ev.id === live.lastEventId) break;
    switch (ev.event_type) {
      case "row_predicted":
        runRow(true); break;
      case "error_row":
        updateGateVisual();
        spawn("e6", C.red, { speed: 1.8, onArrive: () => spawn("e7", C.red, { speed: 2, onArrive: () => spawn("e8", C.red, { speed: 2, onArrive: () => spawn("e14", C.purple, { speed: 1.6, onArrive: () => gateCheck() }) }) }) });
        break;
      case "error_appended":
        updateGateVisual();
        break;
      case "alert_triggered": pulse("monitor"); pulse("alert"); toast(ev.message, C.orange); break;
      case "review_task_created": spawn("e9", C.orange, { speed: 2 }); spawn("e10", C.orange, { speed: 2 }); toast(ev.message, C.orange); break;
      case "retrain_triggered": case "retrain_running": startRetrainLive(); toast(ev.message, C.purple); break;
      case "model_swapped":
        sim.version++; setHud("version", sim.version);
        setBadge("infer", "v" + sim.version);
        NODES.infer.el.classList.add("flip");
        shockwave(NODES.infer.x, NODES.infer.y, C.gold);
        spawn("e13", C.gold, { speed: 1.4, size: 6, glow: 1 });
        toast(ev.message, C.gold, 3400); break;
    }
  }
  if (events.length) live.lastEventId = events[0].id;
}
function startRetrainLive() {
  if (sim.retrain === "running") return;
  sim.retrain = "running";
  spawn("e14", C.purple, { speed: 1.4, onArrive: () => {
    pulse("gate", 900);
    spawn("e15", C.purple, { speed: 1.4, size: 5, glow: 1 });
  }});
  setTimeout(() => { sim.retrain = "idle"; }, 3200);
}

/* ================= 主循环 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const sdt = dt * sim.speed;
  drawBackground(dt);
  drawEdges(dt);
  if (sim.playing) {
    if (!live.on) {
      sim.rowTimer -= sdt;
      if (sim.rowTimer <= 0) { runRow(); sim.rowTimer = 1.15; }
      if (sim.retrain === "running") {
        sim.retrainT += sdt;
        if (sim.retrainT > 3.4) finishRetrain();
      }
    }
  }
  drawParticles(sdt);
  drawWaves(dt);
  renderHud(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= 控件 ================= */
const btnPlay = document.getElementById("btnPlay");
btnPlay.onclick = () => {
  sim.playing = !sim.playing;
  btnPlay.textContent = sim.playing ? "⏸ 暂停" : "▶ 播放";
};
document.getElementById("btnReset").onclick = () => { resetSim(); toast("已重置模拟", C.blue); };
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  sim.speed = Number(b.dataset.s);
  document.querySelectorAll(".spd").forEach(x => x.style.borderColor = "rgba(90,140,200,.35)");
  b.style.borderColor = "#5cb2ff";
});
const btnMode = document.getElementById("btnMode");
btnMode.onclick = () => {
  const panel = document.getElementById("livePanel");
  live.on = !live.on;
  if (live.on) {
    btnMode.textContent = "模式：实时";
    panel.classList.add("open");
    const tokenInput = document.getElementById("liveToken");
    if (!tokenInput.value) tokenInput.placeholder = localStorage.getItem("token") ? "已自动读取本浏览器登录 Token" : "未检测到登录，请粘贴 Token";
    if (live.timer) clearInterval(live.timer);
    loadLiveProjects();
  } else {
    btnMode.textContent = "模式：模拟";
    panel.classList.remove("open");
    if (live.timer) { clearInterval(live.timer); live.timer = null; }
    document.getElementById("connDot").className = "";
    toast("已切回模拟模式", C.blue);
  }
};
document.getElementById("btnConnect").onclick = liveConnect;
document.getElementById("liveProject").addEventListener("change", (e) => {
  live.loopId = null;
  loadLiveLoops(e.target.value);
});
document.getElementById("liveLoop").addEventListener("change", (e) => {
  live.loopId = e.target.value || null;
  localStorage.setItem("demoLiveLoop", live.loopId || "");
});

/* ================= 自适应缩放 ================= */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  document.getElementById("stage").style.transform = `scale(${s})`;
}
addEventListener("resize", fit); fit();

/* 开场 */
setTimeout(() => toast("模拟模式：数据逐行调用推理，报错自动回流 → 告警 → 重训 → 换模型", C.blue, 4200), 600);
</script>
