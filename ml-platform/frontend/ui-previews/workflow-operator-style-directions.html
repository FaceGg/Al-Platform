<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作流算子视觉方向预览</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #08121e;
      --canvas-deep: #06101a;
      --surface: #102033;
      --surface-strong: #152b42;
      --line: #29445f;
      --line-soft: #1b3249;
      --text: #edf5fc;
      --muted: #91a8be;
      --blue: #63b2f6;
      --teal: #5bc8ba;
      --amber: #d6a866;
      --red: #d67d85;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      color: var(--text);
      background: var(--canvas-deep);
      font-family: "Satoshi", "Segoe UI", system-ui, sans-serif;
    }

    button { font: inherit; }

    .preview-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 40px;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--teal);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 740;
      letter-spacing: 0;
    }

    .style-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0c1928;
    }

    .style-switch button {
      min-height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .style-switch button:hover { color: var(--text); }
    .style-switch button:active { transform: scale(.98); }
    .style-switch button.is-active { color: #07131e; background: var(--teal); }

    .canvas {
      min-height: 590px;
      overflow: hidden;
      padding: 26px 28px 30px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background-color: var(--canvas);
      background-image:
        linear-gradient(rgba(100, 163, 211, .10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 163, 211, .10) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .canvas-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .canvas-topline span:last-child { color: var(--teal); }

    .flow {
      display: grid;
      grid-template-columns: 176px minmax(120px, 1fr) 176px;
      align-items: center;
      justify-content: center;
      min-height: 486px;
      padding: 50px 34px 34px;
    }

    .operator {
      --operator-accent: var(--blue);
      position: relative;
      display: grid;
      grid-template-rows: 28px minmax(0, 1fr);
      width: 176px;
      min-height: 176px;
      aspect-ratio: 1;
      overflow: visible;
      padding: 14px 28px 16px;
      border: 1px solid color-mix(in srgb, var(--operator-accent) 54%, var(--line));
      border-radius: 24px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface) 92%, var(--operator-accent));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 14px 28px rgba(1, 13, 24, .22);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .operator--prepare { --operator-accent: var(--amber); }
    .operator--predict { --operator-accent: var(--teal); }
    .operator:hover { transform: translateY(-2px); border-color: var(--operator-accent); }

    .operator::before,
    .operator::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .operator::before {
      top: 12px;
      left: 14px;
      width: 34px;
      height: 2px;
      border-radius: 999px;
      background: var(--operator-accent);
      opacity: .82;
    }

    .operator::after {
      inset: 6px;
      border: 1px solid color-mix(in srgb, var(--operator-accent) 14%, transparent);
      border-radius: 18px;
    }

    .operator__top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .operator__icon {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--operator-accent) 52%, var(--line));
      border-radius: 9px;
      color: var(--operator-accent);
      background: color-mix(in srgb, var(--operator-accent) 10%, transparent);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 800;
    }

    .operator__status {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 7px;
      border: 1px solid color-mix(in srgb, var(--operator-accent) 45%, transparent);
      border-radius: 999px;
      color: var(--operator-accent);
      background: color-mix(in srgb, var(--operator-accent) 10%, transparent);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .operator__identity {
      position: relative;
      z-index: 1;
      align-self: center;
      display: grid;
      gap: 3px;
      min-width: 0;
      text-align: center;
    }

    .operator__name {
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .operator__id {
      overflow: hidden;
      color: var(--muted);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .port {
      position: absolute;
      top: var(--port-y);
      z-index: 3;
      display: grid;
      width: 20px;
      height: 28px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--operator-accent) 72%, var(--line));
      color: var(--operator-accent);
      background: color-mix(in srgb, var(--operator-accent) 15%, var(--surface-strong));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
      transform: translateY(-50%);
      transition: transform 180ms ease, background 180ms ease;
    }

    .port::after {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--surface) 88%, transparent);
      content: "";
    }

    .port--in { left: -20px; border-right: 0; border-radius: 14px 0 0 14px; }
    .port--out { right: -20px; border-left: 0; border-radius: 0 14px 14px 0; }
    .port--config { --operator-accent: var(--amber); }

    .port-label {
      position: absolute;
      top: var(--port-y);
      z-index: 2;
      width: 22px;
      color: color-mix(in srgb, var(--operator-accent) 68%, var(--muted));
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 9px;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
      text-align: center;
      transform: translateY(-50%);
    }

    .port-label--in { left: 5px; }
    .port-label--out { right: 5px; }

    .connection {
      position: relative;
      height: 256px;
    }

    .connection__line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: #407f9b;
      transform: translateY(-50%);
    }

    .connection__line::after {
      position: absolute;
      top: 50%;
      right: -1px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      content: "";
      transform: translateY(-50%);
    }

    .connection__label {
      position: absolute;
      top: calc(50% - 27px);
      left: 50%;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: #0c1928;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 10px;
      transform: translateX(-50%);
    }

    body[data-style="rail"] .operator {
      border-radius: 18px;
      background: #112235;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 12px 24px rgba(1, 13, 24, .2);
    }

    body[data-style="rail"] .operator::before {
      top: 14px;
      bottom: 14px;
      left: 0;
      width: 4px;
      height: auto;
      border-radius: 0 4px 4px 0;
      opacity: 1;
    }

    body[data-style="rail"] .operator::after {
      top: 50px;
      right: 22px;
      bottom: auto;
      left: 28px;
      height: 1px;
      border: 0;
      border-radius: 0;
      background: color-mix(in srgb, var(--operator-accent) 30%, transparent);
    }

    body[data-style="rail"] .operator__icon { border-radius: 7px; background: transparent; }
    body[data-style="rail"] .operator__status { border-radius: 6px; background: transparent; }
    body[data-style="rail"] .operator__identity { align-self: end; gap: 5px; padding-bottom: 3px; text-align: left; }
    body[data-style="rail"] .operator__name { font-size: 15px; text-align: center; }
    body[data-style="rail"] .port-label--in { left: 8px; text-align: left; }
    body[data-style="rail"] .port-label--out { right: 8px; text-align: right; }

    body[data-style="core"] .operator {
      border-radius: 30px;
      background: #0d1d2e;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 18px 34px rgba(1, 13, 24, .24);
    }

    body[data-style="core"] .operator::before { content: none; }

    body[data-style="core"] .operator::after {
      inset: 8px;
      border-radius: 22px;
    }

    body[data-style="core"] .operator__top { padding: 0 2px; }
    body[data-style="core"] .operator__icon { border-radius: 50%; }
    body[data-style="core"] .operator__status { min-width: 28px; justify-content: center; padding: 0 6px; }
    body[data-style="core"] .operator__identity { align-self: center; gap: 4px; }
    body[data-style="core"] .operator__id { color: color-mix(in srgb, var(--operator-accent) 62%, var(--muted)); }
    body[data-style="core"] .port-label { opacity: .7; }

    body[data-style="rail"] .connection__line { background: #6a8198; }
    body[data-style="core"] .connection__line { background: #4d8e8d; }

    @media (max-width: 760px) {
      .preview-shell { width: min(100% - 20px, 1180px); padding-top: 18px; }
      .preview-header { align-items: flex-start; flex-direction: column; }
      .style-switch { width: 100%; }
      .style-switch button { flex: 1; padding: 0 8px; }
      .canvas { min-height: 740px; padding: 22px 18px 28px; }
      .flow { grid-template-columns: 1fr; gap: 58px; min-height: 630px; padding: 50px 28px 36px; }
      .operator { justify-self: center; }
      .connection { display: none; }
    }
  </style>
</head>
<body data-style="frame">
  <main class="preview-shell">
    <header class="preview-header">
      <div>
        <p class="eyebrow">WORKFLOW / OPERATOR STUDY</p>
        <h1>算子视觉方向</h1>
      </div>
      <div class="style-switch" aria-label="算子视觉方向">
        <button class="is-active" type="button" data-style="frame" aria-pressed="true">框架</button>
        <button type="button" data-style="rail" aria-pressed="false">导轨</button>
        <button type="button" data-style="core" aria-pressed="false">核心</button>
      </div>
    </header>

    <section class="canvas" aria-label="工作流算子视觉预览">
      <div class="canvas-topline"><span>ASSEMBLY / WELD QUALITY PIPELINE</span><span>LIVE</span></div>
      <div class="flow">
        <article class="operator operator--prepare" aria-label="焊接数据准备算子">
          <span class="port-label port-label--in" style="--port-y: 38%">SRC</span>
          <span class="port-label port-label--in" style="--port-y: 70%">CFG</span>
          <span class="port-label port-label--out" style="--port-y: 50%">FEA</span>
          <span class="port port--in" style="--port-y: 38%" aria-label="原始数据输入端点"></span>
          <span class="port port--in port--config" style="--port-y: 70%" aria-label="参数输入端点"></span>
          <span class="port port--out" style="--port-y: 50%" aria-label="特征输出端点"></span>
          <div class="operator__top">
            <span class="operator__icon">DP</span>
            <span class="operator__status">READY</span>
          </div>
          <div class="operator__identity">
            <span class="operator__name">焊接数据准备</span>
            <span class="operator__id">prepare_weld_dataset</span>
          </div>
        </article>

        <div class="connection" aria-hidden="true">
          <span class="connection__line"></span>
          <span class="connection__label">features</span>
        </div>

        <article class="operator operator--predict" aria-label="焊接质量预测算子">
          <span class="port-label port-label--in" style="--port-y: 50%">FEA</span>
          <span class="port-label port-label--out" style="--port-y: 38%">SCO</span>
          <span class="port-label port-label--out" style="--port-y: 70%">RES</span>
          <span class="port port--in" style="--port-y: 50%" aria-label="特征输入端点"></span>
          <span class="port port--out" style="--port-y: 38%" aria-label="质量评分输出端点"></span>
          <span class="port port--out" style="--port-y: 70%" aria-label="结果输出端点"></span>
          <div class="operator__top">
            <span class="operator__icon">QP</span>
            <span class="operator__status">RUN</span>
          </div>
          <div class="operator__identity">
            <span class="operator__name">焊接质量预测</span>
            <span class="operator__id">quality_prediction</span>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll(".style-switch [data-style]");
    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        document.body.dataset.style = button.dataset.style;
        buttons.forEach((item) => {
          const active = item === button;
          item.classList.toggle("is-active", active);
          item.setAttribute("aria-pressed", String(active));
        });
      });
    });
  </script>
</body>
</html>
